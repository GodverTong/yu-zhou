<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宇宙 — 上下四方，古往今来</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ============ CSS VARIABLES / DESIGN SYSTEM ============ */
:root {
  /* 间距梯度 */
  --space-1: 5px;
  --space-2: 10px;
  --space-3: 15px;
  --space-4: 20px;
  --space-5: 30px;
  --space-6: 40px;
  --space-7: 60px;

  /* 色彩系统 - 暗夜模式 (默认) */
  --bg-primary: #0a0a12;
  --bg-secondary: #12121f;
  --bg-card: rgba(20, 20, 35, 0.7);
  --bg-glass: rgba(255, 255, 255, 0.04);
  --text-primary: #e8e4dd;
  --text-secondary: #a09888;
  --text-muted: #6a6258;
  --accent-gold: #c9a84c;
  --accent-gold-light: #e8ce7a;
  --accent-gold-dark: #a8882a;
  --accent-red: #c44a4a;
  --border-color: rgba(201, 168, 76, 0.15);
  --shadow-color: rgba(0, 0, 0, 0.5);
  --glow-gold: 0 0 30px rgba(201, 168, 76, 0.15);
  --planet-glow: 0 0 60px rgba(201, 168, 76, 0.08);

  /* 字体 */
  --font-display: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  --font-title: 'Noto Serif SC', 'STSong', serif;
  --font-body: 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif;
  --font-hand: 'ZCOOL XiaoWei', 'STXingkai', serif;

  /* 排版 */
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.5rem;
  --text-2xl: 2rem;
  --text-3xl: 3rem;
  --text-4xl: 4rem;
  --text-5xl: 5rem;
  --text-6xl: 7rem;

  /* 玻璃效果 */
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.06);
  --glass-blur: 20px;

  /* 过渡 */
  --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-slow: 0.8s;
  --duration-med: 0.5s;
  --duration-fast: 0.3s;
}

/* 明亮模式 */
[data-theme="light"] {
  --bg-primary: #f5f0e8;
  --bg-secondary: #ebe4d8;
  --bg-card: rgba(255, 252, 245, 0.85);
  --bg-glass: rgba(0, 0, 0, 0.03);
  --text-primary: #2a2520;
  --text-secondary: #6a6258;
  --text-muted: #a09888;
  --accent-gold: #b8943a;
  --accent-gold-light: #d4b55a;
  --accent-gold-dark: #8a6e20;
  --border-color: rgba(180, 150, 80, 0.2);
  --shadow-color: rgba(0, 0, 0, 0.08);
  --glow-gold: 0 0 30px rgba(180, 150, 80, 0.1);
  --planet-glow: 0 0 60px rgba(180, 150, 80, 0.05);
  --glass-bg: rgba(255, 255, 255, 0.5);
  --glass-border: rgba(0, 0, 0, 0.06);
}

/* ============ RESET & BASE ============ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  transition: background var(--duration-slow) var(--ease-out-expo), color var(--duration-slow) var(--ease-out-expo);
}
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 2px; }

/* ============ STARS BACKGROUND ============ */
#stars-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ============ APP CONTAINER ============ */
#app {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  overflow: hidden;
}

/* ============ PAGE SYSTEM ============ */
.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s var(--ease-out-expo), transform 0.7s var(--ease-out-expo);
  transform: scale(0.96) rotateY(0deg);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-6);
  perspective: 1200px;
}
/* 内容页从顶部对齐，避免flex居中截断顶部内容 */
#page-content {
  align-items: flex-start;
  justify-content: flex-start;
}
.page.active {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1) rotateY(0deg);
}
.page.exit-left {
  opacity: 0;
  transform: translateX(-40px) scale(0.96) rotateY(-3deg);
}
.page.exit-right {
  opacity: 0;
  transform: translateX(40px) scale(0.96) rotateY(3deg);
}
.page.enter-left {
  opacity: 0;
  transform: translateX(40px) scale(0.96) rotateY(3deg);
}
.page.enter-right {
  opacity: 0;
  transform: translateX(-40px) scale(0.96) rotateY(-3deg);
}

/* ============ HOMEPAGE ============ */
#page-home {
  padding: 0;
  overflow: hidden;
}

/* 宇宙标题 */
.cosmos-title {
  position: absolute;
  z-index: 10;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
.cosmos-title .title-char {
  font-family: var(--font-display);
  font-size: clamp(4rem, 15vw, var(--text-6xl));
  font-weight: 900;
  color: var(--accent-gold);
  text-shadow: 0 0 40px rgba(201, 168, 76, 0.2);
  line-height: 0.9;
  letter-spacing: 0.15em;
  display: inline-block;
  position: relative;
  animation: titlePulse 4s ease-in-out infinite;
}
.cosmos-title .title-sub {
  font-family: var(--font-title);
  font-size: var(--text-base);
  color: var(--text-secondary);
  letter-spacing: 0.5em;
  margin-top: var(--space-3);
  font-weight: 300;
}

@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 40px rgba(201, 168, 76, 0.2); }
  50% { text-shadow: 0 0 60px rgba(201, 168, 76, 0.35), 0 0 120px rgba(201, 168, 76, 0.1); }
}

/* 水波纹纹理 - 背景 */
.ripple-bg {
  position: absolute;
  top: 50%; left: 50%;
  width: 80vmin; height: 80vmin;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(circle, rgba(201, 168, 76, 0.03) 0%, transparent 70%);
}
.ripple-ring {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 1px solid rgba(201, 168, 76, 0.08);
  animation: rippleExpand 6s ease-out infinite;
  pointer-events: none;
}
.ripple-ring:nth-child(1) { width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; animation-delay: 0s; }
.ripple-ring:nth-child(2) { width: 50vmin; height: 50vmin; margin: -25vmin 0 0 -25vmin; animation-delay: 1.5s; }
.ripple-ring:nth-child(3) { width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; animation-delay: 3s; }
.ripple-ring:nth-child(4) { width: 90vmin; height: 90vmin; margin: -45vmin 0 0 -45vmin; animation-delay: 4.5s; }

@keyframes rippleExpand {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.3); opacity: 0; }
}

/* ============ SOLAR SYSTEM ============ */
.solar-system {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 5;
  pointer-events: none;
}

.orbit {
  position: absolute;
  top: 50%; left: 50%;
  border: 1px solid rgba(201, 168, 76, 0.06);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.orbit:nth-child(1) { width: 20vmin; height: 20vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(2) { width: 32vmin; height: 32vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(3) { width: 44vmin; height: 44vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(4) { width: 56vmin; height: 56vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(5) { width: 68vmin; height: 68vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(6) { width: 80vmin; height: 80vmin; --ox: 0; --oy: 0; }
.orbit:nth-child(7) { width: 92vmin; height: 92vmin; --ox: 0; --oy: 0; }

.planet {
  position: absolute;
  left: 50%;
  border-radius: 50%;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) var(--ease-out-expo);
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  color: #fff;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
  pointer-events: auto;
}
.planet:hover {
  transform: scale(1.4);
  z-index: 20;
}
.planet .planet-label {
  position: absolute;
  bottom: -2.5em;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-body);
  font-size: 0.6rem;
  white-space: nowrap;
  color: var(--text-secondary);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-out-expo);
  pointer-events: none;
  letter-spacing: 0.05em;
}
.planet:hover .planet-label {
  opacity: 1;
}
.planet .planet-char {
  font-size: 0.9rem;
  font-weight: 700;
  opacity: 0.9;
}
.planet .planet-glow-ring {
  position: absolute;
  top: -4px; left: -4px;
  width: calc(100% + 8px); height: calc(100% + 8px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  animation: glowPulse 3s ease-in-out infinite;
}

/* 行星颜色 */
.planet[data-system="0"] { background: linear-gradient(135deg, #4a90d9, #2a5a9a); box-shadow: 0 0 20px rgba(74,144,217,0.3); }
.planet[data-system="1"] { background: linear-gradient(135deg, #d4a54a, #a07830); box-shadow: 0 0 20px rgba(212,165,74,0.3); }
.planet[data-system="2"] { background: linear-gradient(135deg, #5ab86a, #3a8a4a); box-shadow: 0 0 20px rgba(90,184,106,0.3); }
.planet[data-system="3"] { background: linear-gradient(135deg, #d46060, #a04040); box-shadow: 0 0 20px rgba(212,96,96,0.3); }
.planet[data-system="4"] { background: linear-gradient(135deg, #60a0d4, #4070a0); box-shadow: 0 0 20px rgba(96,160,212,0.3); }
.planet[data-system="5"] { background: linear-gradient(135deg, #b080d4, #8050a0); box-shadow: 0 0 20px rgba(176,128,212,0.3); }
.planet[data-system="6"] { background: linear-gradient(135deg, #d4a0a0, #a07070); box-shadow: 0 0 20px rgba(212,160,160,0.3); }

/* 行星悬浮菜单 */
.planet-menu {
  position: absolute;
  display: none;
  z-index: 30;
  pointer-events: none;
}
.planet-menu.show {
  display: block;
  pointer-events: auto;
}
.planet-menu-item {
  position: absolute;
  width: 7vmin; height: 7vmin;
  min-width: 56px; min-height: 56px;
  border-radius: 50%;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  transition: all var(--duration-med) var(--ease-out-expo);
  font-family: var(--font-body);
  font-size: 0.55rem;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.2;
  animation: menuItemAppear 0.5s var(--ease-out-expo) backwards;
  pointer-events: auto;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.planet-menu-item:hover {
  transform: scale(1.15);
  background: var(--accent-gold);
  color: #fff;
  border-color: var(--accent-gold);
  box-shadow: 0 0 20px rgba(201,168,76,0.3);
}
.planet-menu-item .menu-char {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
}
.planet-menu-item .menu-label {
  font-size: 0.5rem;
  opacity: 0.7;
  margin-top: 1px;
}

@keyframes menuItemAppear {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}

/* ============ DAY/NIGHT TOGGLE ============ */
.theme-toggle {
  position: fixed;
  z-index: 100;
  cursor: pointer;
  transition: all var(--duration-med) var(--ease-out-expo);
}
.theme-toggle-light {
  top: var(--space-5);
  left: var(--space-5);
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f5e6c8, #f0d8a0);
  border: 1px solid rgba(180,150,80,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8a7020;
  font-size: 1.2rem;
  box-shadow: 0 2px 20px rgba(180,150,80,0.15);
}
.theme-toggle-light:hover { transform: scale(1.1); box-shadow: 0 2px 30px rgba(180,150,80,0.25); }
.theme-toggle-dark {
  bottom: var(--space-5);
  right: var(--space-5);
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a09888;
  font-size: 1.2rem;
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}
.theme-toggle-dark:hover { transform: scale(1.1); box-shadow: 0 2px 30px rgba(0,0,0,0.4); }

/* ============ BREADCRUMB ============ */
.breadcrumb {
  position: fixed;
  bottom: var(--space-5);
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--text-secondary);
  opacity: 0;
  transition: opacity var(--duration-med) var(--ease-out-expo);
  pointer-events: none;
}
.breadcrumb.show { opacity: 1; pointer-events: auto; }
.breadcrumb-item {
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-out-expo);
  padding: 2px 6px;
  border-radius: 4px;
}
.breadcrumb-item:hover { color: var(--accent-gold); }
.breadcrumb-sep { color: var(--text-muted); font-size: 0.6rem; }
.breadcrumb-current { color: var(--accent-gold); }

/* ============ SYSTEM PAGE LAYOUT ============ */
.system-page {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-5);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.system-header {
  text-align: center;
  margin-bottom: var(--space-7);
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.8s var(--ease-out-expo) forwards;
}
.system-header .system-icon {
  font-family: var(--font-display);
  font-size: var(--text-5xl);
  color: var(--accent-gold);
  display: block;
  line-height: 1;
  margin-bottom: var(--space-3);
}
.system-header .system-name {
  font-family: var(--font-title);
  font-size: var(--text-3xl);
  font-weight: 700;
  margin-bottom: var(--space-2);
}
.system-header .system-motto {
  font-family: var(--font-hand);
  font-size: var(--text-lg);
  color: var(--text-secondary);
  font-style: italic;
}
.system-header .data-source-badge {
  margin-top: var(--space-3);
  display: inline-block;
  padding: var(--space-1) var(--space-3);
  background: var(--glass-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

/* 分类切换标签 */
.category-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-5);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-color);
}
.category-tab {
  padding: var(--space-1) var(--space-3);
  background: var(--glass-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out-expo);
  user-select: none;
}
.category-tab:hover {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  background: rgba(255, 215, 0, 0.08);
}
.category-tab.active {
  background: var(--accent-gold);
  color: #000;
  border-color: var(--accent-gold);
  font-weight: 600;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* 子系统卡片网格 */
.sub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-4);
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}
.sub-card {
  aspect-ratio: 1;
  background: var(--bg-card);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--duration-med) var(--ease-out-expo);
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.6s var(--ease-out-expo) forwards;
}
.sub-card:nth-child(1) { animation-delay: 0.1s; }
.sub-card:nth-child(2) { animation-delay: 0.2s; }
.sub-card:nth-child(3) { animation-delay: 0.3s; }
.sub-card:nth-child(4) { animation-delay: 0.4s; }
.sub-card:nth-child(5) { animation-delay: 0.5s; }

.sub-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  right: 0; bottom: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(201,168,76,0.03) 100%);
  opacity: 0;
  transition: opacity var(--duration-med) var(--ease-out-expo);
}
.sub-card:hover::before { opacity: 1; }
.sub-card:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(201,168,76,0.3);
  box-shadow: 0 8px 40px rgba(0,0,0,0.2), var(--glow-gold);
}
.sub-card .sub-char {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  color: var(--accent-gold);
  margin-bottom: var(--space-2);
  line-height: 1;
}
.sub-card .sub-name {
  font-family: var(--font-title);
  font-size: var(--text-base);
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.sub-card .sub-desc {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  color: var(--text-muted);
  text-align: center;
  line-height: 1.4;
}

/* ============ CONTENT PAGE ============ */
.content-page-inner {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-5);
}
.content-header {
  margin-bottom: var(--space-6);
}
.content-header .back-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: color var(--duration-fast) var(--ease-out-expo);
  margin-bottom: var(--space-4);
  border: none;
  background: none;
  padding: var(--space-1) var(--space-2);
  border-radius: 8px;
}
.content-header .back-btn:hover { color: var(--accent-gold); }
.content-header .content-title {
  font-family: var(--font-title);
  font-size: var(--text-2xl);
  font-weight: 700;

// STARS BACKGROUND
// ============================================================
function initStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = [];
    const count = Math.floor((W * H) / 8000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.02 + 0.005
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const isLight = state.theme === 'light';
    stars.forEach(s => {
      s.a += (Math.random() - 0.5) * s.speed;
      s.a = Math.max(0.1, Math.min(0.8, s.a));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = isLight
        ? `rgba(100, 90, 70, ${s.a * 0.3})`
        : `rgba(255, 255, 255, ${s.a * 0.5})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  draw();
  window.addEventListener('resize', resize);
}

let planetElements = [];
let planetAngles = [];
let planetOrbitRadii = [];
let planetSizes = [];
const PLANET_COLORS = [
  'linear-gradient(135deg, #4a90d9, #2a5a9a)',
  'linear-gradient(135deg, #d4a54a, #a07830)',
  'linear-gradient(135deg, #5ab86a, #3a8a4a)',

];

function initSolarSystem() {
  solarSystem.innerHTML = '';
  planetElements = [];
  planetAngles = [];
  planetOrbitRadii = [];

  SYSTEMS.forEach((sys, i) => {
    const orbit = document.createElement('div');
    orbit.className = 'orbit';

    const size = 3.6 + i * 0.4;
    planetSizes[i] = size;

    const planet = document.createElement('div');
    planet.className = 'planet';
    planet.dataset.system = i;
    planet.style.background = PLANET_COLORS[i];
    planet.style.width = size + 'vmin';
    planet.style.height = size + 'vmin';
    planet.style.marginLeft = -(size / 2) + 'vmin';
    planet.style.top = -(size / 2) + 'vmin';
    planet.style.fontSize = (0.6 + i * 0.05) + 'rem';

    // 今天对应的系统放大
    const today = new Date().getDay();
    if (i === today) {
      planet.style.transform = 'scale(1.3)';
      planet.style.boxShadow = `0 0 40px rgba(201,168,76,0.3)`;
      planet.style.zIndex = '10';
    }

    const charSpan = document.createElement('span');
    charSpan.className = 'planet-char';
    charSpan.textContent = sys.char;
    planet.appendChild(charSpan);

    const label = document.createElement('span');
    label.className = 'planet-label';
    label.textContent = sys.name;
    planet.appendChild(label);

    const ring = document.createElement('div');
    ring.className = 'planet-glow-ring';
    planet.appendChild(ring);

    planet.addEventListener('click', (e) => {
      e.stopPropagation();
      openSystem(i);
    });
    planet.addEventListener('mouseenter', () => showPlanetMenu(i, planet));
    planet.addEventListener('mouseleave', () => hidePlanetMenu());

    orbit.appendChild(planet);
    solarSystem.appendChild(orbit);

    planetElements.push(planet);
    planetAngles.push(Math.random() * Math.PI * 2);
    planetOrbitRadii.push(10 + i * 6); // 轨道半径 vmin
  });

  // 启动 JS 轨道动画
  animateOrbits();
}

let orbitAnimId = null;
let orbitStartTime = 0;
const ORBIT_SPEEDS = [0.5, 0.4, 0.3, 0.25, 0.2, 0.17, 0.15]; // rad/s

function animateOrbits() {
  if (!orbitStartTime) orbitStartTime = performance.now();
  const elapsed = (performance.now() - orbitStartTime) / 1000;

  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const vmin = Math.min(window.innerWidth, window.innerHeight) / 100;

  planetElements.forEach((planet, i) => {
    const angle = planetAngles[i] + elapsed * ORBIT_SPEEDS[i];
    const radius = planetOrbitRadii[i] * vmin;
    const px = cx + Math.cos(angle) * radius - planet.offsetWidth / 2;
    const py = cy + Math.sin(angle) * radius - planet.offsetHeight / 2;
    planet.style.left = px + 'px';
    planet.style.top = py + 'px';
  });

  orbitAnimId = requestAnimationFrame(animateOrbits);
}

// ============================================================
// PLANET MENU
// ============================================================
function showPlanetMenu(idx, planetEl) {
  const rect = planetEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  planetMenu.innerHTML = '';
  planetMenu.style.display = 'block';
  planetMenu.classList.add('show');

  const sys = SYSTEMS[idx];
  const count = sys.subs.length;
  const radius = 90;

  sys.subs.forEach((sub, i) => {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;

    const item = document.createElement('div');
    item.className = 'planet-menu-item';
    item.style.left = (cx + x - 28) + 'px';
    item.style.top = (cy + y - 28) + 'px';
    item.style.animationDelay = (i * 0.05) + 's';

    item.innerHTML = `
      <span class="menu-char">${sub.char}</span>
      <span class="menu-label">${sub.name}</span>
    `;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePlanetMenu();
      openSubSystem(idx, i);
    });
    planetMenu.appendChild(item);
  });
}

function hidePlanetMenu() {
  planetMenu.classList.remove('show');
  setTimeout(() => { planetMenu.style.display = 'none'; }, 300);
}

// ============================================================
// PAGE NAVIGATION
// ============================================================
function navigateTo(pageId, direction) {
  if (state.isTransitioning) return;
  state.isTransitioning = true;

  const current = document.querySelector('.page.active');
  const target = document.getElementById(pageId);

  if (!target || current === target) {
    state.isTransitioning = false;
    return;
  }

  const dir = direction || 'left';

  // 隐藏星球菜单
  hidePlanetMenu();

  // 清理所有页面动画状态
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('enter-left', 'enter-right', 'exit-left', 'exit-right');
  });

  // 退出动画 - 当前页滑出
  current.classList.remove('active');
  current.classList.add(dir === 'left' ? 'exit-left' : 'exit-right');

  // 目标进入 - 从另一侧滑入
  target.classList.add(dir === 'left' ? 'enter-right' : 'enter-left');

  // 强制回流后执行动画
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      target.classList.remove('enter-left', 'enter-right');
      target.classList.add('active');
      current.classList.remove('exit-left', 'exit-right');
      // 等 CSS 过渡完成后重置
      setTimeout(() => {
        state.isTransitioning = false;
      }, 850);
    });
  });
}

    ${idx === 0 ? '<div class="data-source-badge">数据来源：Notion · 法相天地.csv（67条思维模型） / 语雀文档</div>' : ''}
  `;
  container.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'sub-grid';

  sys.subs.forEach((sub, i) => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML = `
      <span class="sub-char">${sub.char}</span>

      <span class="sub-desc">${sub.desc}</span>
    `;
    card.addEventListener('click', () => openSubSystem(idx, i));

  });

  container.appendChild(grid);

  navLeft.classList.remove('show');

  navigateTo('page-system', direction || 'left');
}

function getLearningItemDesc(subIdx, itemIdx, itemName) {
  const subKeys = ['道', '法', '术', '器', '势'];
  const key = subKeys[subIdx];
  if (key && LEARNING_DATA[key] && LEARNING_DATA[key].items[itemName]) {
    const item = LEARNING_DATA[key].items[itemName];
    if (typeof item === 'string') return item;
    return item.desc || '相关内容';
  }
  return `${LEARNING_DATA[key]?.desc || '相关内容'} · 数据来源：语雀文档，可通过上传功能补充更多数据。`;
}

function getLearningItemFullDesc(subIdx, itemIdx, itemName) {
  const subKeys = ['道', '法', '术', '器', '势'];
  const key = subKeys[subIdx];
  const data = LEARNING_DATA[key];
  if (!data) return '暂无详细数据';
  const item = data.items[itemName];
  if (!item) return `<p>${data.desc}</p>`;
  if (typeof item === 'string') {
    return `<div class="detail-section">
      <div class="detail-section-title">${itemName}</div>
      <p class="detail-section-body">${item}</p>
      <div class="detail-section-meta">
        <span>所属：${key}·${itemName}</span>
        <span>数据来源：语雀文档</span>
      </div>
    </div>`;
  }
  return `<div class="detail-section">
    <div class="detail-section-title">${itemName}</div>
    <p class="detail-section-body">${item.desc || ''}</p>
    <div class="detail-section-meta">
      <span>数据来源：Notion《法相天地.csv》</span>
      <span>共 ${item.entries ? item.entries.length : 0} 条记录</span>
    </div>
  </div>`;
}

// 生成瀑布流卡片数据
function generateWaterfallCards(sysIdx, subIdx, sub, catIdx) {
  const subKeys = ['道', '法', '术', '器', '势'];
  const key = subKeys[subIdx];
  const data = LEARNING_DATA[key];
  if (!data) return [];

  const itemName = sub.items[catIdx || 0];
  const item = data.items[itemName];
  if (!item) return [];

  // 如果 item 是字符串（简单描述），生成一张卡片
  if (typeof item === 'string') {
    return [{
      title: itemName,
      desc: truncateText(item, 120),
      meta: '数据来源：语雀',
      height: '0',
      fullHtml: `<p>${item}</p>`
    }];
  }

  // 如果 item 有 entries 数组，为每个条目生成卡片
  if (item.entries && item.entries.length > 0) {
    return item.entries.map((entry, i) => {
      const statusMap = { '完成': '✅', '学习': '📖', '等待': '⏳' };
      const statusEmoji = statusMap[entry.status] || '';
      const progressHtml = entry.progress ? `<span class="card-progress">进度: ${entry.progress}%</span>` : '';
      const meta = `${statusEmoji} ${entry.status || ''} ${progressHtml}`.trim();

      // 构建详情 HTML
      let detailHtml = `<div class="detail-section">
        <div class="detail-section-title">${entry.name}</div>`;
      if (entry.explanation) {
        detailHtml += `<div class="detail-field">
          <span class="detail-field-label">📝 核心解释</span>
          <p class="detail-field-value">${entry.explanation}</p>
        </div>`;
      }
      if (entry.example && entry.example !== '-') {
        detailHtml += `<div class="detail-field">
          <span class="detail-field-label">💡 案例/应用</span>
          <p class="detail-field-value">${entry.example}</p>
        </div>`;
      }
      if (entry.progress) {
        detailHtml += `<div class="detail-field">
          <span class="detail-field-label">📊 学习进度</span>
          <p class="detail-field-value">${entry.progress}%</p>
        </div>`;
      }
      detailHtml += `<div class="detail-section-meta">
        <span>分类：${itemName}</span>
        <span>状态：${entry.status || '待学习'}</span>
        <span>数据来源：Notion</span>
      </div></div>`;

      // 随机高度偏移，让瀑布流更自然
      const heights = ['0', '8px', '16px', '4px', '12px', '20px'];
      const height = heights[i % heights.length];

      return {
        title: entry.name,
        desc: entry.explanation || '',
        meta: meta,
        height: height,
        fullHtml: detailHtml
      };
    });
  }

  // 兜底：返回一张描述卡片
  return [{
    title: itemName,
    desc: truncateText(item.desc || data.desc, 120),
    meta: '',
    height: '0',
    fullHtml: `<p>${item.desc || data.desc}</p>`
  }];
}

function truncateText(text, maxLen) {
  if (text.length <= maxLen) return text;
  return text.substring(0, maxLen) + '...';
}

// 卡片详情弹窗
let activeEscHandler = null;

function showCardDetail(title, contentHtml) {
  const overlay = document.createElement('div');
  overlay.className = 'detail-overlay';
  overlay.innerHTML = `
    <div class="detail-modal">
      <div class="detail-modal-header">
        <h2 class="detail-modal-title">${title}</h2>
        <button class="detail-modal-close" id="detailCloseBtn">✕</button>
      </div>
      <div class="detail-modal-body">${contentHtml}</div>
    </div>
  `;
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDetail(overlay);
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('active'));
  document.getElementById('detailCloseBtn').addEventListener('click', () => closeDetail(overlay));
  activeEscHandler = (e) => {
    if (e.key === 'Escape') closeDetail(overlay);
  };
  document.addEventListener('keydown', activeEscHandler);
}

function closeDetail(overlay) {
  overlay.classList.remove('active');
  setTimeout(() => overlay.remove(), 300);
  if (activeEscHandler) {
    document.removeEventListener('keydown', activeEscHandler);
    activeEscHandler = null;
  }
}

function openSubSystem(sysIdx, subIdx) {
  const sys = SYSTEMS[sysIdx];
  const sub = sys.subs[subIdx];
  state.currentSub = subIdx;
  state.pageStack.push({ type: 'system', idx: sysIdx });

  // 如果子系统有多个分类，默认选中第一个
  const initialCategory = sub.items && sub.items.length > 0 ? 0 : 0;
  renderSubContent(sysIdx, subIdx, sub, initialCategory);
}

function renderSubContent(sysIdx, subIdx, sub, catIdx) {
  const page = pageContent;
  page.innerHTML = '';

  const inner = document.createElement('div');
  inner.className = 'content-page-inner';

  const header = document.createElement('div');
  header.className = 'content-header';
  header.innerHTML = `
    <button class="back-btn" onclick="goBack()">← 返回 ${SYSTEMS[sysIdx].name}</button>
    <h1 class="content-title">${sub.char} · ${sub.name}</h1>
    <p class="content-sub">${sub.desc}</p>
  `;
  inner.appendChild(header);

  // 分类切换标签（仅当有多分类时显示）
  if (sub.items && sub.items.length > 1) {
    const tabBar = document.createElement('div');
    tabBar.className = 'category-tabs';
    sub.items.forEach((itemName, i) => {
      const tab = document.createElement('span');
      tab.className = 'category-tab' + (i === catIdx ? ' active' : '');
      tab.textContent = itemName;
      tab.addEventListener('click', () => renderSubContent(sysIdx, subIdx, sub, i));
      tabBar.appendChild(tab);
    });
    inner.appendChild(tabBar);
  }

  // 每日推荐（仅对有详细条目的分类显示 — 思维模型/认知偏差等）
  const itemName = sub.items[catIdx || 0];
  let dailyEntries = null;
  // 尝试从 LEARNING_DATA 获取（学习系统）
  const subKeys = ['道', '法', '术', '器', '势'];
  if (subIdx < subKeys.length) {
    const ld = LEARNING_DATA[subKeys[subIdx]];
    if (ld && ld.items[itemName] && ld.items[itemName].entries) {
      dailyEntries = ld.items[itemName].entries;
    }
  }
  // 如果 LEARNING_DATA 没有，尝试从 FAXIANG_DATA 获取（Notion 导入）
  if (!dailyEntries && typeof FAXIANG_DATA !== 'undefined' && FAXIANG_DATA[itemName]) {
    dailyEntries = FAXIANG_DATA[itemName];
  }
  if (dailyEntries && dailyEntries.length > 0) {
    const dailyCard = createDailyRecommendation(dailyEntries, itemName, sysIdx, subIdx);
    if (dailyCard) inner.appendChild(dailyCard);
  }

  const grid = document.createElement('div');
  grid.className = 'content-grid';

  // 生成瀑布流卡片数据
  const waterfallCards = generateWaterfallCards(sysIdx, subIdx, sub, catIdx);

  waterfallCards.forEach((card, i) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'content-card';
    // 随机高度效果
    const extraPadding = card.height || '0';
    cardEl.style.paddingBottom = extraPadding;
    cardEl.innerHTML = `
      <h3 class="card-title">${card.title}</h3>
      <p class="card-desc">${card.desc}</p>
      ${card.meta ? `<div class="card-meta">${card.meta}</div>` : ''}
      <span class="card-expand-hint">点击展开详情 →</span>
    `;
    cardEl.addEventListener('click', () => showCardDetail(card.title, card.fullHtml || `<p>${card.desc}</p>`));
    grid.appendChild(cardEl);
  });

  inner.appendChild(grid);
  page.appendChild(inner);

  updateBreadcrumb([
    { label: '宇宙', page: 'page-home' },
    { label: SYSTEMS[sysIdx].name, page: 'page-system' },
    { label: sub.name }
  ]);
  updateIndicator(2, 2);

  navLeft.classList.add('show');
  navRight.classList.remove('show');

  navigateTo('page-content', 'left');
}

// ============================================================
// GO BACK
// ============================================================
function goBack() {
  const prev = state.pageStack.pop();
  if (prev) {
    if (prev.type === 'system') {
      openSystem(prev.idx, 'right');
    }
  } else {
    goHome();
  }
}

function goHome() {
  state.currentSystem = null;
  state.currentSub = null;
  state.history = [];
  state.pageStack = [];
  breadcrumb.classList.remove('show');
  navLeft.classList.remove('show');
  navRight.classList.remove('show');
  pageIndicator.classList.remove('show');
  hidePlanetMenu();
  // 重置系统页和内容页
  pageSystem.innerHTML = '';
  pageContent.innerHTML = '';
  navigateTo('page-home', 'right');
}

// ============================================================
// BREADCRUMB
// ============================================================
function updateBreadcrumb(items) {
  breadcrumb.innerHTML = '';
  items.forEach((item, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'breadcrumb-sep';
      sep.textContent = '·';
      breadcrumb.appendChild(sep);
    }
    const el = document.createElement('span');
    if (item.page && i < items.length - 1) {
      el.className = 'breadcrumb-item';
      el.textContent = item.label;
      el.addEventListener('click', () => {
        if (item.page === 'page-home') goHome();
      });
    } else {
      el.className = 'breadcrumb-current';
      el.textContent = item.label;
    }
    breadcrumb.appendChild(el);
  });
  breadcrumb.classList.add('show');
  pageIndicator.classList.add('show');
}

function updateIndicator(current, total) {
  indicatorCurrent.textContent = current;
  indicatorTotal.textContent = total;
  pageIndicator.classList.add('show');
}

// ============================================================
// THEME TOGGLE
// ============================================================
$('themeLight').addEventListener('click', () => setTheme('light'));
$('themeDark').addEventListener('click', () => setTheme('dark'));

function setTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
}

// ============================================================
// WEEKDAY
// ============================================================
function updateWeekday() {
  const now = new Date();
  const day = now.getDay();
  dayName.textContent = WEEKDAY_NAMES[day];
  daySystem.textContent = '今日 · ' + WEEKDAY_SYSTEMS[day] + '宇宙';
}

// ============================================================
// TOP NAVIGATION
// ============================================================
function initTopNav() {
  const container = document.getElementById('topNavInner');
  container.innerHTML = '';
  SYSTEMS.forEach((sys, i) => {
    const item = document.createElement('span');
    item.className = 'top-nav-item';
    item.innerHTML = `<span class="nav-char">${sys.char}</span>${sys.name.replace('系统', '')}`;
    item.addEventListener('click', () => {
      hidePlanetMenu();
      openSystem(i);
    });
    container.appendChild(item);
  });
  // 延迟显示导航栏
  setTimeout(() => {
    document.getElementById('topNav').classList.add('show');
  }, 2000);
}

// ============================================================
// KEYBOARD NAVIGATION
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') {
    const active = document.querySelector('.page.active');
    if (active && active.id !== 'page-home') {
      goBack();
    }
  } else if (e.key === 'ArrowRight') {
    // forward navigation
  } else if (e.key === 'Escape') {
    goHome();
  }
});

// ============================================================
// NAVIGATION BUTTONS
// ============================================================
navLeft.addEventListener('click', goBack);
navRight.addEventListener('click', () => {
  // 当前在系统页，进入第一个子页面
  if (state.currentSystem !== null && state.currentSub === null) {
    openSubSystem(state.currentSystem, 0);
  }
});

// ============================================================
// TOUCH / SWIPE
// ============================================================
let touchStartX = 0;
let touchEndX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 80) {
    if (diff > 0) {
      // 左滑 - 前进
      const active = document.querySelector('.page.active');
      if (active && active.id === 'page-system' && state.currentSub === null) {
        openSubSystem(state.currentSystem, 0);
      }
    } else {
      // 右滑 - 后退
      goBack();
    }
  }
});

// ============================================================
// PARALLAX EFFECT (只影响背景，不干扰轨道动画)
// ============================================================
document.addEventListener('mousemove', (e) => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx;
  const dy = (e.clientY - cy) / cy;
  // 应用 parallax 到 ripple-bg 和 cosmos-title，不干扰 orbit 的 CSS 动画
  const ripple = document.querySelector('.ripple-bg');
  if (ripple) {
    ripple.style.transform = `translate(calc(-50% + ${dx * 8}px), calc(-50% + ${dy * 8}px))`;
  }
  const title = document.querySelector('.cosmos-title');
  if (title) {
    title.style.transform = `translate(${dx * 4}px, ${dy * 4}px)`;
  }
});

// ============================================================
// NOTION 数据同步
// ============================================================
let notionSyncStatus = 'idle'; // idle | syncing | success | error

async function fetchNotionData() {
  if (notionSyncStatus === 'syncing') return;
  notionSyncStatus = 'syncing';

  try {
    const res = await fetch('/api/notion-data');
    const json = await res.json();

    if (json.success && json.data && json.data.length > 0) {
      // 更新思维模型数据
      const target = LEARNING_DATA['法'].items['思维模型'];
      if (target) {
        target.entries = json.data;
        target.desc = `思维模型知识库，从 Notion 数据库自动同步，共 ${json.count} 条记录。`;
      }
      notionSyncStatus = 'success';
      console.log(`[Notion] 同步成功: ${json.count} 条思维模型 (${json.updatedAt})`);

      // 如果当前页面正在显示思维模型，刷新显示
      const currentPage = document.querySelector('#page-content.active');
      if (currentPage && state.currentSystem !== null && state.currentSub !== null) {
        const sys = SYSTEMS[state.currentSystem];
        if (sys && sys.subs[state.currentSub]) {
          const sub = sys.subs[state.currentSub];
          if (sub.name === '法相天地') {
            // 重新渲染当前内容
            const activeTab = document.querySelector('.category-tab.active');
            const catIdx = activeTab ? Array.from(document.querySelectorAll('.category-tab')).indexOf(activeTab) : 0;
            renderSubContent(state.currentSystem, state.currentSub, sub, catIdx >= 0 ? catIdx : 0);
          }
        }
      }
    } else {
      notionSyncStatus = 'error';
      console.warn('[Notion] 同步返回空数据，使用本地缓存');
    }
  } catch (err) {
    notionSyncStatus = 'error';
    console.warn('[Notion] 同步失败，使用本地缓存:', err.message);
  }
}

// ============================================================
// INIT
// ============================================================
function init() {
  initStars();
  initSolarSystem();
  updateWeekday();
  initTopNav();

  // 系统默认主题跟随系统
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark ? 'dark' : 'light');

  // 隐藏加载屏
  setTimeout(() => {
    loadingScreen.classList.add('hidden');
  }, 1200);

  // 每 10 秒更新星期
  setInterval(updateWeekday, 600000);

  // 延迟加载 Notion 数据（不影响首页渲染）
  setTimeout(fetchNotionData, 500);
}

// ============================================================
// DAILY RECOMMENDATION
// ============================================================
function createDailyRecommendation(entries, categoryName, sysIdx, subIdx) {
  if (!entries || entries.length === 0) return null;

  // 基于日期选取当日推荐（确保同一天同一结果）
  const today = new Date();
  const dateSeed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
  const idx = dateSeed % entries.length;
  const entry = entries[idx];

  if (!entry) return null;

  const card = document.createElement('div');
  card.className = 'daily-recommend';

  // 构建详情 HTML
  const detailHtml = `
    <div class="detail-section">
      <div class="detail-section-title">${entry.name}</div>
      <p class="detail-section-body"><strong>释义：</strong>${entry.explanation || '暂无'}</p>
      ${entry.example && entry.example !== '-' ? `<p class="detail-section-body" style="margin-top:12px;"><strong>案例：</strong>${entry.example}</p>` : ''}
      ${entry.progress ? `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-color);font-size:0.85rem;color:var(--text-muted);">进度：${entry.progress === 100 ? '✅ 已完成' : entry.progress + '%'}</div>` : ''}
      <div class="detail-section-meta" style="margin-top:16px;">
        <span>${categoryName || '思维模型'}</span>
        <span>${today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' })} 推荐</span>
      </div>
    </div>
  `;

  card.innerHTML = `
    <div class="daily-recommend-badge">✦ 每日推荐</div>
    <div class="daily-recommend-title">${entry.name}</div>
    <div class="daily-recommend-explain">${entry.explanation || '暂无释义'}</div>
    ${entry.example && entry.example !== '-' ? `<div class="daily-recommend-example">${entry.example}</div>` : ''}
    <div class="daily-recommend-hint">点击查看完整详情 → ${categoryName} · 共 ${entries.length} 个模型</div>
    <div class="daily-recommend-count">#${idx + 1}</div>
  `;

  card.addEventListener('click', () => showCardDetail(entry.name, detailHtml));

  return card;
}

// 页面准备好后初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
